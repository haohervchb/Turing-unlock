# One-shot volatile unlock experiment. Normal Ubuntu default unchanged.
# Staging does not arm this entry; user controls cold shutdown and power-on.
# ARCHIVAL TEMPLATE ONLY: configure the ESP UUID after platform review.
# Do not set this entry as GRUB_DEFAULT: its configfile return can loop.
if [ "$grub_platform" = "efi" ]; then
    menuentry 'RTX 2080 Ti EXPERIMENT v4 (volatile unlock; no flash)' --id tu102-experiment-v4 {
        insmod part_gpt
        insmod fat
        insmod chain
        insmod search_fs_uuid
        set next_entry=
        if save_env next_entry; then
            if load_env next_entry; then
                if [ -z "$next_entry" ]; then
                    if search --no-floppy --fs-uuid --set=tu102_esp CONFIGURE_ESP_FS_UUID; then
                        echo 'Volatile unlock attempt. If STOP/hang: fully power off/on.'
                        if chainloader ($tu102_esp)/EFI/2080TI-PREFLIGHT/TU102EX4.EFI; then
                            boot
                        fi
                    fi
                fi
            fi
        fi
        echo 'Experiment completed or refused; inspect saved log. Continuing to Ubuntu.'
        set default=0
        sleep --interruptible 5
        configfile $prefix/grub.cfg
    }
fi
